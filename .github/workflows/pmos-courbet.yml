name: Build pmOS boot.img for courbet

# postmarketOS needs real Linux; this PC has none, so CI is the build host.
# Source is kevinwidjaja21/pmaports @ courbet_stable (the only working
# variant per the pmOS wiki, channel v24.12). GitLab is behind the Anubis
# anti-bot gate, so a CI runner cannot clone or download from it: download
# the branch tarball once in a real browser, attach it to a GitHub release
# in THIS repo, and pass the release asset URL as the input.
#
# Tarball URL pattern in a browser (works there, not from CI):
#   https://gitlab.postmarketos.org/kevinwidjaja21/pmaports/-/archive/courbet_stable/pmaports-courbet_stable.tar.gz

on:
  workflow_dispatch:
    inputs:
      pmaports_tarball:
        description: 'pmaports tarball URL (GitHub release asset)'
        required: true
      channel:
        description: 'pmOS release channel (wiki says v24.12 only)'
        required: false
        default: 'v24.12'
      kernel_pkg:
        description: 'kernel package to build'
        required: false
        default: 'linux-postmarketos-qcom-sm7150'
      device:
        description: 'pmOS device codename'
        required: false
        default: 'xiaomi-courbet'
      cmdline:
        description: 'kernel cmdline baked into the test image'
        required: false
        default: 'console=tty0'

env:
  BUILD_DIR: /home/pmuser/pmbuild

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates file cpio patch binutils \
            python3 python3-venv python3-pip \
            build-essential bc bison flex gawk libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils \
            qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu
          mkdir -p out

      - name: Install pmbootstrap
        run: |
          set -e
          sudo python3 -m venv /opt/pmbootstrap
          if ! sudo /opt/pmbootstrap/bin/pip install --no-cache-dir pmbootstrap; then
            echo "latest pmbootstrap not installable, falling back to pinned 2.1.0"
            sudo /opt/pmbootstrap/bin/pip install --no-cache-dir "pmbootstrap==2.1.0"
          fi
          sudo ln -sf /opt/pmbootstrap/bin/pmbootstrap /usr/local/bin/pmbootstrap
          /opt/pmbootstrap/bin/python -c "import pmb; print('pmb imports OK')"

      - name: Create build user
        run: |
          set -e
          sudo adduser --disabled-password --gecos "" pmuser
          echo "pmuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/pmuser
          sudo install -d -o pmuser -g pmuser -m 0755 "$BUILD_DIR"

      - name: Fetch pmaports tarball
        run: |
          set -e
          curl -Lf -o /tmp/pmaports.tar.gz "${{ github.event.inputs.pmaports_tarball }}"
          if ! head -c 2 /tmp/pmaports.tar.gz | grep -q "$(printf '\037\213')"; then
            echo "::error::URL did not return a gzip tarball (Anubis challenge page?)."
            echo "Download the courbet_stable tarball in a real browser, attach it"
            echo "to a GitHub release in this repo, and pass that asset URL."
            head -c 300 /tmp/pmaports.tar.gz || true
            exit 1
          fi
          sudo -u pmuser -H tar -xzf /tmp/pmaports.tar.gz -C "$BUILD_DIR"
          sudo -u pmuser -H bash -c "mv '$BUILD_DIR'/pmaports-* '$BUILD_DIR/pmaports'"
          echo "--- device port present? ---"
          ls "$BUILD_DIR/pmaports/device/community" | grep -i courbet
          echo "--- kernel aport present? ---"
          ls -d "$BUILD_DIR/pmaports/device/community/${{ github.event.inputs.kernel_pkg }}"

      - name: Write pmbootstrap config
        run: |
          set -e
          sudo mkdir -p /home/pmuser/.config
          sudo tee /home/pmuser/.config/pmbootstrap.cfg > /dev/null <<EOF
          [pmbootstrap]
          aports = $BUILD_DIR/pmaports
          device = ${{ github.event.inputs.device }}
          kernel = mainline
          work = $BUILD_DIR/work
          EOF
          sudo chown pmuser:pmuser /home/pmuser/.config/pmbootstrap.cfg
          sudo chmod 600 /home/pmuser/.config/pmbootstrap.cfg

      - name: pmbootstrap init
        run: |
          set -e
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' init" 2>&1 | tee out/init.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Set channel and report config
        run: |
          set -e
          PMB="sudo -u pmuser -H env HOME=/home/pmuser XDG_CONFIG_HOME=/home/pmuser/.config \
               pmbootstrap -c /home/pmuser/.config/pmbootstrap.cfg -w '$BUILD_DIR/work'"
          $PMB config channel "${{ github.event.inputs.channel }}" 2>&1 | tee out/channel.log || \
            echo "channel key not accepted, see config dump below"
          echo "--- effective config ---"
          $PMB config 2>&1 | tee -a out/channel.log || true

      - name: Build kernel package
        run: |
          set -e
          sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' build \
                     '${{ github.event.inputs.kernel_pkg }}' --force" 2>&1 | tee out/kernel.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Install into chroot (produces kernel + initramfs)
        run: |
          set -e
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' install --no-fde" 2>&1 | tee out/install.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Collect kernel, initramfs, dtb
        run: |
          set -e
          ROOT="$(sudo find "$BUILD_DIR/work" -maxdepth 1 -name 'chroot_rootfs_*' | head -1)"
          echo "chroot: $ROOT"
          sudo ls -la "$ROOT/boot"
          sudo cp "$ROOT"/boot/vmlinuz* out/vmlinuz
          sudo cp "$ROOT"/boot/initramfs* out/initramfs
          DTB="$(sudo find "$ROOT/boot" -name '*courbet*.dtb' | head -1 || true)"
          if [ -z "$DTB" ]; then
            echo "::error::no courbet dtb in $ROOT/boot; available dtbs:"
            sudo find "$ROOT/boot" -name '*.dtb' | head -20 || true
            exit 1
          fi
          echo "dtb: $DTB"
          sudo cp "$DTB" out/courbet.dtb
          sudo chown runner:runner out/*
          ls -la out

      - name: Package fastboot-bootable image
        run: |
          set -e
          python3 - <<'PY'
          import struct
          k = open("out/vmlinuz", "rb").read()
          r = open("out/initramfs", "rb").read()
          try:
              t = open("out/courbet.dtb", "rb").read()
          except FileNotFoundError:
              t = b""
          page = 4096
          n = lambda s: (s + page - 1) // page
          hdr = bytearray(page)
          hdr[0:8] = b"ANDROID!"
          struct.pack_into("<10I", hdr, 8,
                           len(k), 0x8000, len(r), 0x1000000, 0, 0, 0x100, page, 0, 0)
          cmd = "${{ github.event.inputs.cmdline }}".encode()
          assert len(cmd) < 512
          hdr[64:64 + len(cmd)] = cmd
          img = bytes(hdr) + k + b"\0" * (n(len(k)) * page - len(k))
          img += r + b"\0" * (n(len(r)) * page - len(r)) + t
          open("out/boot-pmos-courbet.img", "wb").write(img)
          print("kernel %d  ramdisk %d  dtb %d  image %d" % (len(k), len(r), len(t), len(img)))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-courbet
          path: out/
          if-no-files-found: error
          retention-days: 30
